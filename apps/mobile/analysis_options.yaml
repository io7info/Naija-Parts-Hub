include: package:flutter_lints/flutter.yaml

# The inherited pubspec declared flutter_lints but shipped no
# analysis_options.yaml, so no lint was ever actually enforced — and CI ran
# `flutter analyze` against default rules only.

analyzer:
  errors:
    # Treat these as build failures, not advisories. Each maps to a defect
    # class found in the inherited code.
    invalid_use_of_protected_member: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # BuildContext held across an await — the source of several mounted-check
    # bugs in the original screens.
    use_build_context_synchronously: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # Controllers and subscriptions must be disposed. The inherited code had
    # zero dispose() overrides across ~13 TextEditingControllers.
    - cancel_subscriptions
    - close_sinks

    # Relative within lib/, matching the code style in this app.
    - prefer_relative_imports
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    # require_trailing_commas is deliberately omitted: `dart format` already
    # produces consistent output, so the rule only adds hand-editing churn.
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
