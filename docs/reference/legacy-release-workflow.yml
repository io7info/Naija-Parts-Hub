name: Build & Release Naija Hub Parts

# Triggers:
#  - Push a tag like v1.0.0 -> builds signed AAB + APK, attaches to a GitHub Release
#  - Manual run from the Actions tab (workflow_dispatch)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    name: Build signed release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0" # bump to match your dev's local version
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer (fails build on lint errors)
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true # remove this line once you actually have tests

      # ---- Decode signing keystore from GitHub Secrets ----
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      # ---- Build Play Store bundle (this is what you upload to Play Console) ----
      - name: Build AAB (App Bundle)
        run: flutter build appbundle --release

      # ---- Also build a plain APK, handy for beta testers / sideloading ----
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: naija-hub-parts-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naija-hub-parts-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release with build files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

